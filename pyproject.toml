[project]
name = "typesafe-computer-use"
version = "0.1.0"
description = "Cheap, fast computer use on macOS: deterministic screen state, a TypeSafe classifier for every decision, a writer model only for free text."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Aaron Levin" }]
keywords = ["computer-use", "automation", "ocr", "typesafe", "macos", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "anthropic==1.6.0",
    "msgspec==0.21.1",
    "ocrmac==1.0.1",
    "pyobjc-framework-ApplicationServices==12.2.2",
    "pyobjc-framework-Quartz==12.2.2",
    "typesafe-sdk==0.6.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]
voice = ["faster-whisper==1.2.1", "sounddevice==0.5.6"]

[project.urls]
Homepage = "https://github.com/awlevin/typesafe-computer-use"
Issues = "https://github.com/awlevin/typesafe-computer-use/issues"

[project.scripts]
clicker = "typesafe_computer_use.cli:main"
clicker-inspect = "typesafe_computer_use.cli:inspect"
clicker-voice = "typesafe_computer_use.cli:voice"

[build-system]
requires = ["hatchling==1.32.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typesafe_computer_use"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
